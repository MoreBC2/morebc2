name: Deploy MoreBC2 to Cloudflare Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type and content check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Check Windows node documentation
        run: npm run check:windows-node-docs

      - name: Scan generated output for private paths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import path from 'node:path';

          const forbidden = [
            'C:\\Users\\Dan\\',
            'C:\\\\Users\\\\Dan\\\\',
            'Users\\Dan',
            '/Users/Dan',
          ].map((value) => Buffer.from(value));

          async function listFiles(directory) {
            const entries = await readdir(directory, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                files.push(...await listFiles(fullPath));
              } else if (entry.isFile()) {
                files.push(fullPath);
              }
            }
            return files;
          }

          const matches = [];
          for (const file of await listFiles('dist')) {
            const contents = await readFile(file);
            if (forbidden.some((value) => contents.includes(value))) {
              matches.push(file);
            }
          }

          if (matches.length > 0) {
            console.error(`Private Windows path found in generated output:\n${matches.join('\n')}`);
            process.exit(1);
          }
          console.log('Generated output contains no blocked private path variants.');
          NODE

      - name: Deploy production site
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=morebc2 --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live indexing policy
        shell: bash
        run: |
          set -euo pipefail

          robots_url='https://morebc2.pages.dev/robots.txt'
          site_url='https://morebc2.pages.dev/'

          for attempt in {1..12}; do
            robots="$(curl --fail --silent --show-error "$robots_url")"
            headers="$(curl --fail --silent --show-error --head "$site_url" | tr -d '\r')"

            if ! grep -Eq '^Disallow:[[:space:]]*/[[:space:]]*$' <<<"$robots" \
              && ! grep -Ei '^x-robots-tag:' <<<"$headers" | grep -Eiq 'noindex|nofollow|noarchive|nosnippet'; then
              echo 'Live robots.txt:'
              printf '%s\n' "$robots"
              echo 'Live response headers:'
              printf '%s\n' "$headers"
              echo 'Live indexing policy verification passed.'
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done

          echo 'Live indexing policy verification failed.' >&2
          echo 'robots.txt:' >&2
          printf '%s\n' "$robots" >&2
          echo 'response headers:' >&2
          printf '%s\n' "$headers" >&2
          exit 1
